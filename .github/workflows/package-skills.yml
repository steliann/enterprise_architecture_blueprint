name: Package skills

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create skill ZIPs
        run: |
          mkdir -p dist
          for tier in core labs; do
            for d in $tier/skills/*; do
              [ -f "$d/SKILL.md" ] || continue
              name=$(basename "$d")
              (cd "$tier/skills" && zip -qr "../../dist/${name}.zip" "$name")
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-ai-skills
          path: dist/*.zip
